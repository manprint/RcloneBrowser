name: Build Rclone Browser

on:
  push:
    branches:
      - main
      - master
    # Pushing a version tag (e.g. v2.0.0 or v2.0.0-beta.1) publishes a release.
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.11.3'

jobs:
  build_windows:
    name: Windows Build (x64)
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'
      - name: Build Rclone Browser
        run: |
          mkdir build
          cd build
          # Let CMake auto-detect the newest installed Visual Studio generator
          # (windows-latest ships VS 2026, not VS 2022).
          cmake -A x64 -DCMAKE_CONFIGURATION_TYPES="Release" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DRB_BUILD_TESTS=ON ..
          cmake --build . --config Release
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --no-translations --no-compiler-runtime --no-svg ".\build\Release\RcloneBrowser.exe"
      - name: Run unit tests
        run: |
          # the test executables load the Qt DLLs from the Qt install
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --test-dir build -L unit --output-on-failure -C Release
          if ($LASTEXITCODE -ne 0) { & ./scripts/ci-rerun-failed.ps1 -BuildDir build; exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build\build\Release\*

  build_windows_arm64:
    name: Windows Build (ARM64)
    # Build natively on an ARM64 runner. Cross-compiling ARM64 from an x64 host
    # needs the win64_msvc2022_arm64_cross_compiled kit, which aqtinstall 3.3.0
    # (the latest release) cannot patch for Qt 6.10.x.
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v7
      - name: Install Qt (ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows_arm64'
          target: 'desktop'
          arch: 'win64_msvc2022_arm64'
          modules: 'qtmultimedia'
      - name: Build Rclone Browser
        shell: pwsh
        run: |
          mkdir build
          cd build
          # Let CMake auto-detect the newest installed Visual Studio generator.
          cmake -A ARM64 -DCMAKE_CONFIGURATION_TYPES="Release" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DRB_BUILD_TESTS=ON ..
          cmake --build . --config Release
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --no-translations --no-compiler-runtime --no-svg ".\build\Release\RcloneBrowser.exe"
      - name: Run unit tests
        shell: pwsh
        run: |
          # the test executables load the Qt DLLs from the Qt install
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --test-dir build -L unit --output-on-failure -C Release
          if ($LASTEXITCODE -ne 0) { & ./scripts/ci-rerun-failed.ps1 -BuildDir build; exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          path: build\build\Release\*
          
  build_linux:
    name: Linux Build (AppImage)
    # Build on an older LTS than the Qt 6 minimum requires to keep the
    # resulting AppImage's glibc/libstdc++ dependency as low as practical.
    # ubuntu-22.04 is the oldest GitHub-hosted image that still satisfies
    # Qt 6.10's toolchain requirements.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'

      - name: Install build and runtime dependencies
        run: |
          sudo apt update
          sudo apt -y install \
            build-essential cmake file patchelf \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Download linuxdeploy AppImage tools
        run: |
          mkdir -p "$HOME/linuxdeploy"
          curl -L -o "$HOME/linuxdeploy/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o "$HOME/linuxdeploy/linuxdeploy-plugin-qt" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -L -o "$HOME/linuxdeploy/linuxdeploy-plugin-appimage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          # linuxdeploy expects its own executable, and its plugins, to be
          # found under these exact names on PATH - the .AppImage suffix
          # in the release asset names must not survive the download.
          chmod +x "$HOME/linuxdeploy/"linuxdeploy*
          echo "$HOME/linuxdeploy" >> "$GITHUB_PATH"

      - name: Download rclone for the e2e tests
        run: |
          set -euo pipefail
          RCLONE_VERSION=v1.75.2
          BASE_URL="https://downloads.rclone.org/${RCLONE_VERSION}"
          ZIP="rclone-${RCLONE_VERSION}-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/rclone-download" "$RUNNER_TEMP/rclone"
          cd "$RUNNER_TEMP/rclone-download"
          curl -fsSL -O "${BASE_URL}/${ZIP}"
          curl -fsSL -o SHA256SUMS "${BASE_URL}/SHA256SUMS"
          # the expected hash comes from the SHA256SUMS published next to the zip
          EXPECTED="$(awk -v f="$ZIP" '$2 == f { print $1 }' SHA256SUMS)"
          test "$(printf '%s\n' "$EXPECTED" | wc -l)" -eq 1
          test -n "$EXPECTED"
          echo "${EXPECTED}  ${ZIP}" | sha256sum -c -
          unzip -q -j "$ZIP" "rclone-${RCLONE_VERSION}-linux-amd64/rclone" -d "$RUNNER_TEMP/rclone"
          chmod +x "$RUNNER_TEMP/rclone/rclone"
          "$RUNNER_TEMP/rclone/rclone" version

      - name: Build Rclone Browser
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_INSTALL_PREFIX=/usr \
            -DRB_BUILD_TESTS=ON -DRB_TEST_RCLONE="$RUNNER_TEMP/rclone/rclone"
          make --jobs="$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure -C Release

      - name: Run e2e tests
        run: ctest --test-dir build -L e2e --output-on-failure -C Release

      - name: Install into AppDir
        run: make -C build install DESTDIR="$GITHUB_WORKSPACE/AppDir"

      - name: Build AppImage
        env:
          # No FUSE inside the GitHub Actions container - extract and run instead.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          VERSION="$(cat VERSION)-$(git rev-parse --short HEAD)"
          export VERSION

          linuxdeploy \
            --appdir AppDir \
            --desktop-file=AppDir/usr/share/applications/rclone-browser.desktop \
            --plugin qt \
            --output appimage

          mkdir -p build/build
          mv ./*.AppImage "build/build/rclone-browser-${VERSION}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
         name: linux
         path: build/build/*.AppImage
         
  build_macos:
    name: macOS Build (Apple Silicon)
    # macos-latest runners are Apple Silicon; build natively for arm64.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia'
      - name: Build Rclone Browser
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DRB_BUILD_TESTS=ON
          make -j "$(sysctl -n hw.ncpu)"
      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure -C Release
      - name: Bundle, sign and package DMG
        run: |
          cd build/build
          "$QT_ROOT_DIR/bin/macdeployqt" rclone-browser.app
          mv rclone-browser.app "Rclone Browser.app"

          # Apple Silicon refuses to launch unsigned code and macdeployqt
          # rewrites the bundled binaries, so re-sign the whole bundle ad-hoc.
          # The app is not notarized: on first launch Gatekeeper asks to
          # confirm it (right click > Open).
          codesign --force --deep --sign - "Rclone Browser.app"
          codesign --verify --deep --strict --verbose=2 "Rclone Browser.app"
          lipo -archs "Rclone Browser.app/Contents/MacOS/rclone-browser"
          plutil -lint "Rclone Browser.app/Contents/Info.plist"
          plutil -p "Rclone Browser.app/Contents/Info.plist"
          # minimum macOS required by the bundled Qt
          vtool -show-build "Rclone Browser.app/Contents/Frameworks/QtCore.framework/QtCore" | grep -E 'platform|minos'

          # Ship a DMG: the artifact upload and the release zip would flatten
          # the framework symlinks and break the code signature.
          mkdir dmg
          mv "Rclone Browser.app" dmg/
          ln -s /Applications dmg/Applications
          VERSION="$(cat "$GITHUB_WORKSPACE/VERSION")-$(git rev-parse --short HEAD)"
          DMG="rclone-browser-${VERSION}-macos-arm64.dmg"
          # hdiutil is occasionally "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname "Rclone Browser" -srcfolder dmg -ov -format UDZO "$DMG" && break
            sleep 5
          done
          test -f "$DMG"
      - name: Smoke test DMG
        run: |
          cd build/build
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" rclone-browser-*-macos-arm64.dmg
          # a missing framework or a broken signature kills the app at once
          "$MNT/Rclone Browser.app/Contents/MacOS/rclone-browser" > smoke.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "Rclone Browser still running after 15s"
            kill "$PID"
            wait "$PID" 2>/dev/null || true
          else
            echo "Rclone Browser exited early:"
            cat smoke.log
            exit 1
          fi
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: build/build/*.dmg
        
  build_freebsd:
    name: FreeBSD Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      - name: Install Development Tools and Build Rclone Browser
        uses: vmactions/freebsd-vm@v1
        with:
          mem: 4096
          usesh: true
          prepare: |
            env ASSUME_ALWAYS_YES=YES pkg update -f
            env ASSUME_ALWAYS_YES=YES pkg install -y git cmake qt6-base qt6-multimedia
          run: |
            mkdir build
            cd build
            cmake -DRB_BUILD_TESTS=ON ..
            make
            cd ..
            ctest --test-dir build -L unit --output-on-failure -C Release
            
      - uses: actions/upload-artifact@v7
        with:
          name: freebsd
          path: build/build/*

  # Steps follow README "OpenBSD"; never run before 13.2 (package names,
  # prefixes and the action tag are unverified).
  build_openbsd:
    name: OpenBSD Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install Development Tools, Build and Test Rclone Browser
        uses: vmactions/openbsd-vm@v1
        with:
          mem: 4096
          usesh: true
          prepare: |
            pkg_add cmake qt6
          run: |
            set -e
            mkdir build
            cd build
            cmake -DCMAKE_PREFIX_PATH=/usr/local/lib/qt6/cmake -DRB_BUILD_TESTS=ON ..
            make
            cd ..
            ctest --test-dir build -L unit --output-on-failure -C Release

  # Steps follow README "NetBSD"; never run before 13.2 (package names,
  # prefixes and the action tag are unverified).
  build_netbsd:
    name: NetBSD Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install Development Tools, Build and Test Rclone Browser
        uses: vmactions/netbsd-vm@v1
        with:
          mem: 4096
          usesh: true
          prepare: |
            # the VM image has no X11 sets, which the qt6-qtbase package
            # links against (/usr/X11R7): add xbase and xcomp first
            for set in xbase xcomp; do
              ftp -o - "https://cdn.netbsd.org/pub/NetBSD/NetBSD-$(uname -r)/$(uname -m)/binary/sets/$set.tar.xz" | xz -dc | tar -xpf - -C /
            done
            command -v pkgin >/dev/null 2>&1 || /usr/sbin/pkg_add -v pkgin
            pkgin update
            pkgin -y install cmake qt6-qtbase
          run: |
            set -e
            mkdir build
            cd build
            cmake -DCMAKE_PREFIX_PATH=/usr/pkg/qt6 -DRB_BUILD_TESTS=ON ..
            make
            cd ..
            ctest --test-dir build -L unit --output-on-failure -C Release

  create_release:
    name: Create GitHub Release
    # Only version tags publish a release. Branch pushes, pull requests and
    # manual runs keep their builds as artifacts of the workflow run.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # build_openbsd and build_netbsd are deliberately not listed: they must never block a release.
    needs: [build_windows, build_windows_arm64, build_linux, build_macos, build_freebsd]
    permissions:
      contents: write

    steps:
      # VERSION is read from the tagged commit, so the repository is needed.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: VERSION
      - name: Check the tag matches VERSION
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || [[ "${GITHUB_REF_NAME#v}" == "$(cat VERSION)"-* ]] || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"
            exit 1
          }
      - name: Create artifact directory
        run: rm -rf /tmp/artifacts /tmp/release && mkdir /tmp/artifacts /tmp/release
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts
      - name: Prepare release assets
        run: |
          cd /tmp/artifacts
          for i in *; do
            case "$i" in
              # already single-file packages: publish them as they are
              macos-arm64|linux) mv "$i"/* /tmp/release/ ;;
              *) zip -r -0 "/tmp/release/$i.zip" "$i" ;;
            esac
          done
          ls -l /tmp/release

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "/tmp/release/*"
          name: Rclone Browser ${{ github.ref_name }}
          generateReleaseNotes: true
          # tags with a suffix such as v2.0.0-beta.1 are marked as prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag: ${{ github.ref_name }}
